# Temporary workaround for https://github.com/omacom/omarchy/issues/17755
# Sorts after zz-omarchy-kernel-modules.conf in mkinitcpio's version order.
# The optional suffix lets mkinitcpio skip the module where it is unavailable.
case " ${MODULES[*]} " in
  *" t2bce_vhci "*|*" t2bce_vhci? "*) ;;
  *) MODULES+=("t2bce_vhci?") ;;
esac
