---
- name: Configure Bluetooth when requested
  ansible.builtin.include_tasks:
    file: ../extra_bluetooth.yml
    apply:
      tags: [features]
  when: features.bluetooth

- name: Configure the optional GRUB and Btrfs snapshot integration
  ansible.builtin.include_tasks:
    file: ../extra_snapper.yml
    apply:
      tags: [features]
  when: features.snapper

- name: Configure the optional KDE input remapping integration
  ansible.builtin.include_tasks:
    file: ../extra_keybindings.yml
    apply:
      tags: [features]
  when:
    - features.keybindings
    - desktop_profile == 'kde'

- name: Configure removable storage integrations
  ansible.builtin.import_tasks: removable_storage.yml
  tags: [removable_storage]

- name: Apply the Omarchy T2 LUKS keyboard workaround
  ansible.builtin.import_tasks: ../desktop/omarchy/t2_luks_keyboard.yml
  when:
    - desktop_profile == 'omarchy'
    - features.t2_luks_keyboard_workaround
  tags: [t2_luks_keyboard]
