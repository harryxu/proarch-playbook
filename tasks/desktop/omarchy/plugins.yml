---
- name: Check whether each plugin is already installed
  ansible.builtin.stat:
    path: "{{ target_home }}/.config/omarchy/plugins/{{ item.id }}/manifest.json"
    get_checksum: false
    get_mime: false
  loop: "{{ omarchy_settings.plugins }}"
  loop_control:
    label: "{{ item.id }}"
  register: installed_plugins

- name: Install only missing plugin sources
  ansible.builtin.git:
    repo: "{{ item.item.repo }}"
    dest: "{{ target_home }}/.config/omarchy/plugins/{{ item.item.id }}"
    version: "{{ item.item.version | default('HEAD') }}"
    update: false
    force: false
  loop: "{{ installed_plugins.results }}"
  loop_control:
    label: "{{ item.item.id }}"
  when: not item.stat.exists
  notify: Rescan Omarchy plugins

- name: Read deployed plugin manifests
  ansible.builtin.slurp:
    src: "{{ target_home }}/.config/omarchy/plugins/{{ item.id }}/manifest.json"
  loop: "{{ omarchy_settings.plugins }}"
  register: plugin_manifests
  when: not ansible_check_mode

- name: Verify that each plugin's ID matches its installation directory
  ansible.builtin.assert:
    that: (item.content | b64decode | from_json).id == item.item.id
  loop: "{{ plugin_manifests.results }}"
  loop_control:
    label: "{{ item.item.id }}"
  when: not ansible_check_mode
