---
- name: Configure keyboard types
  ansible.builtin.import_tasks: keyboard.yml

- name: Configure managed and local keybindings
  ansible.builtin.import_tasks: bindings.yml

- name: Copy personal window appearance
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/files/omarchy/hypr/looknfeel.lua"
    dest: "{{ target_home }}/.config/hypr/looknfeel.lua"
    mode: '0644'
    backup: true
  notify: Reload Hyprland

- name: Configure plugin-dependent autostart
  ansible.builtin.template:
    src: "{{ playbook_dir }}/templates/omarchy/autostart.lua.j2"
    dest: "{{ target_home }}/.config/hypr/autostart.lua"
    mode: '0644'
    backup: true
  notify: Reload Hyprland

- name: Work around floating fullscreen window stacking
  ansible.builtin.import_tasks: floating_fullscreen_workaround.yml
