---
- name: Deploy the managed top bar
  ansible.builtin.include_tasks: bar.yml
  vars:
    omarchy_stock_bar_dir: "{{ (ansible_facts.env.OMARCHY_PATH | default('/usr/share/omarchy')) + '/shell/plugins/bar' }}"
    omarchy_top_bar_dir: "{{ target_home }}/.config/omarchy/plugins/proarch.bar"
  when: omarchy_settings.manage_top_bar

- name: Check for existing personal Shell preferences
  ansible.builtin.stat:
    path: "{{ target_home }}/.config/omarchy/shell.json"
  register: omarchy_shell_file

- name: Read personal Shell preferences or installed system defaults
  ansible.builtin.slurp:
    src: >-
      {{ target_home + '/.config/omarchy/shell.json' if omarchy_shell_file.stat.exists
         else (ansible_facts.env.OMARCHY_PATH | default('/usr/share/omarchy')) + '/config/omarchy/shell.json' }}
  register: omarchy_shell_source

- name: Merge managed Shell preferences while preserving personal settings
  ansible.builtin.copy:
    dest: "{{ target_home }}/.config/omarchy/shell.json"
    content: "{{ omarchy_shell_desired | to_nice_json }}\n"
    mode: '0600'
    backup: true
  vars:
    omarchy_shell_current: "{{ omarchy_shell_source.content | b64decode | from_json }}"
    omarchy_shell_base: >-
      {{ (omarchy_shell_current | place_omarchy_bar_widgets)
         if omarchy_settings.manage_top_bar else omarchy_shell_current }}
    omarchy_shell_merged: >-
      {{ omarchy_shell_base | combine(omarchy_settings.shell, recursive=true)
         | combine({'plugins': omarchy_shell_current.plugins | default([])
                    | merge_omarchy_plugins(omarchy_settings.plugins)}) }}
    omarchy_shell_desired: >-
      {{ omarchy_shell_merged
         | apply_omarchy_bar_visibility(omarchy_settings.hide_superwhisper_tray_icon,
                                        omarchy_settings.disable_agents_panel) }}
  when: not omarchy_shell_file.stat.exists or omarchy_shell_desired != omarchy_shell_current
  notify: Synchronize Omarchy bar appearance

- name: Query the explicit screensaver preference
  ansible.builtin.command: omarchy-toggle-enabled screensaver-off
  register: screensaver_disabled
  changed_when: false
  failed_when: screensaver_disabled.rc not in [0, 1]
  check_mode: false

- name: Restore the screensaver preference without toggling blindly
  ansible.builtin.command:
    argv: [omarchy, toggle, screensaver-off, "{{ 'off' if omarchy_settings.screensaver_enabled else 'on' }}"]
  when: (screensaver_disabled.rc == 0) == omarchy_settings.screensaver_enabled
  changed_when: true
