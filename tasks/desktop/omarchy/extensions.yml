---
- name: Deploy explicitly maintained menu extensions
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ target_home }}/.config/omarchy/extensions/{{ item | basename }}"
    mode: '0644'
    backup: true
  loop: "{{ query('ansible.builtin.fileglob', playbook_dir ~ '/files/omarchy/extensions/*.jsonc') }}"

- name: Deploy explicitly maintained event hooks
  ansible.builtin.include_tasks: hook.yml
  loop: "{{ omarchy_settings.hooks | default([]) }}"
  loop_control:
    loop_var: omarchy_hook
