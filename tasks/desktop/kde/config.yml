- name: Install KDE packages.
  community.general.pacman:
    name:
    - kdiff3
    - kommit
    - kvantum
    - sddm
    - kwallet-pam
    state: present
- name: Install KDE Apps from aur.
  kewlfft.aur.aur:
    use: yay
    state: present
    name:
    - konsave
    - sddm-silent-theme
  become: true
  become_user: aur_builder
- name: Setup KDE theme
  become: true
  block:
  - name: Ensure KDE personal directories exist
    ansible.builtin.file:
      path: '{{ target_home }}/{{ item }}'
      state: directory
      mode: '0755'
    loop:
    - .config/Kvantum
    - .local/share/kwin/tabbox
  - name: Check if Graphite KDE theme is installed
    stat:
      path: '{{ target_home }}/.local/share/plasma/desktoptheme/Graphite-nord-light'
    register: graphite_installed
  - name: Clone Graphite KDE theme.
    git:
      repo: https://github.com/vinceliuice/Graphite-kde-theme.git
      dest: /tmp/Graphite-kde-theme
      clone: true
      update: true
    when: not graphite_installed.stat.exists
  - name: Install Graphite KDE theme.
    when: not graphite_installed.stat.exists and not ansible_check_mode
    ansible.builtin.command:
      argv:
      - ./install.sh
      chdir: /tmp/Graphite-kde-theme
      creates: '{{ target_home }}/.local/share/plasma/desktoptheme/Graphite-nord-light'
  - name: Enable theme
    community.general.kdeconfig:
      kwriteconfig_path: /usr/bin/kwriteconfig6
      path: '{{ target_home }}/.config/plasmarc'
      values:
      - group: Theme
        key: name
        value: Graphite-nord-light
      backup: true
  - name: Ensure tabbox directory exists.
    become: true
    file:
      path: '{{ target_home }}/.local/share/kwin/tabbox'
      recurse: true
      state: directory
    become_user: '{{ target_user }}'
    environment:
      HOME: '{{ target_home }}'
  - name: AquaMediumIcons tabbox style
    stat:
      path: '{{ target_home }}/.local/share/kwin/tabbox/AquaMediumIcons'
    register: aquaicon_style
  - name: Clone AquaMediumIcons tabbox style
    git:
      repo: https://github.com/harryxu/kde-aquamediumicons.git
      dest: '{{ target_home }}/.local/share/kwin/tabbox/AquaMediumIcons'
      clone: true
      update: true
    when: not aquaicon_style.stat.exists
  - name: kwinrc
    community.general.kdeconfig:
      kwriteconfig_path: /usr/bin/kwriteconfig6
      path: '{{ target_home }}/.config/kwinrc'
      values:
      - group: org.kde.kdecoration2
        key: library
        value: org.kde.kwin.aurorae
      - group: org.kde.kdecoration2
        key: theme
        value: __aurorae__svg__Graphite-light
      - group: TabBox
        key: ApplicationsMode
        value: 1
      - group: TabBox
        key: HighlightWindows
        bool_value: false
      - group: TabBox
        key: LayoutName
        value: AquaMediumIcons
      - group: Desktops
        key: Number
        value: 3
      backup: true
  - name: Check if Tela Circle Icon theme is installed
    stat:
      path: '{{ target_home }}/.local/share/icons/Tela-circle'
    register: tela_icon_installed
  - name: Clone Tela Circle Icon theme.
    git:
      repo: https://github.com/vinceliuice/Tela-circle-icon-theme.git
      dest: /tmp/Tela-circle-icon-theme
      clone: true
      update: true
    when: not tela_icon_installed.stat.exists
  - name: Install Tela Circle Icon theme.
    when: not tela_icon_installed.stat.exists and not ansible_check_mode
    ansible.builtin.command:
      argv:
      - ./install.sh
      chdir: /tmp/Tela-circle-icon-theme
      creates: '{{ target_home }}/.local/share/icons/Tela-circle'
  - name: Setup kdeglobals
    community.general.kdeconfig:
      kwriteconfig_path: /usr/bin/kwriteconfig6
      path: '{{ target_home }}/.config/kdeglobals'
      values:
      - group: KDE
        key: AnimationDurationFactor
        value: 0.5
      - group: KDE
        key: LookAndFeelPackage
        value: com.github.vinceliuice.Graphite-nord-light
      - group: KDE
        key: widgetStyle
        value: kvantum
      backup: true
  - name: kvantum.kvconfig
    copy:
      dest: '{{ target_home }}/.config/Kvantum/kvantum.kvconfig'
      content: '[General]

        theme=Graphite

        '
      force: false
  become_user: '{{ target_user }}'
  environment:
    HOME: '{{ target_home }}'
- name: Setup Screen Locking
  become: true
  become_user: '{{ target_user }}'
  community.general.kdeconfig:
    kwriteconfig_path: /usr/bin/kwriteconfig6
    path: '{{ target_home }}/.config/kscreenlockerrc'
    values:
    - group: Greeter
      key: WallpaperPlugin
      value: org.kde.potd
    - groups:
      - Greeter
      - Wallpaper
      - org.kde.potd
      - General
      key: Provider
      value: bing
    - groups:
      - Greeter
      - Wallpaper
      - org.kde.potd
      - General
      key: UpdateOverMeteredConnection
      bool_value: true
    backup: true
- name: Configure SDDM theme
  community.general.ini_file:
    path: /etc/sddm.conf
    section: Theme
    option: Current
    value: silent
    no_extra_spaces: true
    backup: true
  become: true
- name: Copy SDDM silent theme background image
  ansible.builtin.copy:
    src: '{{ playbook_dir }}/files/sddm/themes/silent/backgrounds/ristretto.jpg'
    dest: /usr/share/sddm/themes/silent/backgrounds/random.jpg
    force: false
  become: true
- name: Check if random-backgrounds directory exists
  ansible.builtin.stat:
    path: /usr/share/sddm/themes/silent/backgrounds/random-backgrounds
  register: random_backgrounds_dir
  become: true
- name: Download and extract random-backgrounds
  when: not random_backgrounds_dir.stat.exists
  become: true
  block:
  - name: Download random-backgrounds.zip
    ansible.builtin.get_url:
      url: https://github.com/harryxu/proarch-playbook/releases/download/0.1/random-backgrounds.zip
      dest: /tmp/random-backgrounds.zip
      mode: '0644'
  - name: Ensure random-backgrounds directory exists
    ansible.builtin.file:
      path: /usr/share/sddm/themes/silent/backgrounds/random-backgrounds
      state: directory
      mode: '0755'
  - name: Extract random-backgrounds.zip
    ansible.builtin.unarchive:
      src: /tmp/random-backgrounds.zip
      dest: /usr/share/sddm/themes/silent/backgrounds/random-backgrounds
      remote_src: true
- name: Copy randombg.sh to SDDM silent theme directory
  ansible.builtin.copy:
    src: '{{ playbook_dir }}/files/sddm/themes/silent/randombg.sh'
    dest: /usr/share/sddm/themes/silent/randombg.sh
    mode: '0755'
    force: true
  become: true
- name: Ensure systemd sddm.service drop-in directory exists
  ansible.builtin.file:
    path: /etc/systemd/system/sddm.service.d
    state: directory
    mode: '0755'
  become: true
- name: Install systemd drop-in to run randombg.sh before SDDM
  ansible.builtin.copy:
    dest: /etc/systemd/system/sddm.service.d/randombg.conf
    mode: '0644'
    content: '[Service]

      ExecStartPre=/usr/share/sddm/themes/silent/randombg.sh

      '
  become: true
  register: sddm_dropin
- name: Reload systemd daemon after drop-in change
  ansible.builtin.systemd:
    daemon_reload: true
  become: true
  when: sddm_dropin.changed
- name: Copy SDDM silent theme altumfish config
  ansible.builtin.copy:
    src: '{{ playbook_dir }}/files/sddm/themes/silent/configs/altumfish.conf'
    dest: /usr/share/sddm/themes/silent/configs/altumfish.conf
    force: false
  become: true
- name: Update SDDM silent theme ConfigFile to altumfish.conf
  community.general.ini_file:
    path: /usr/share/sddm/themes/silent/metadata.desktop
    section: SddmGreeterTheme
    option: ConfigFile
    value: configs/altumfish.conf
    no_extra_spaces: true
    backup: true
  become: true
