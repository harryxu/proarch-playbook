---
- name: Require KDE before installing or configuring xremap
  ansible.builtin.assert:
    that: desktop_profile | default('') == 'kde'
    fail_msg: xremap requires the KDE desktop profile.

- name: Create KDE xremap directories
  ansible.builtin.file:
    path: "{{ target_home }}/{{ item }}"
    state: directory
    owner: "{{ target_user }}"
    mode: '0755'
  loop:
    - .local/share/xremap-features/kde
    - .local/bin
    - .config/systemd/user

- name: Install xremap with KDE support only
  community.general.cargo:
    name: xremap
    path: "{{ target_home }}/.local/share/xremap-features/kde"
    features: [kde]
  become: true
  become_user: "{{ target_user }}"
  environment:
    HOME: "{{ target_home }}"

- name: Add the KDE user to the input group
  ansible.builtin.user:
    name: "{{ target_user }}"
    groups: input
    append: true

- name: Load uinput on boot
  ansible.builtin.copy:
    dest: /etc/modules-load.d/uinput.conf
    content: "uinput\n"
    owner: root
    group: root
    mode: '0644'

- name: Grant input-device access to logged-in users
  ansible.builtin.copy:
    dest: /etc/udev/rules.d/99-input-for-xremap.rules
    content: |
      KERNEL=="uinput", GROUP="input", TAG+="uaccess"
    owner: root
    group: root
    mode: '0644'

- name: Install the KDE-only launcher
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/files/kde/xremap-launcher"
    dest: "{{ target_home }}/.local/bin/xremap-launcher"
    owner: "{{ target_user }}"
    mode: '0755'
    backup: true
  register: xremap_launcher

- name: Install the KDE-only session unit
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/files/kde/xremap.service"
    dest: "{{ target_home }}/.config/systemd/user/xremap.service"
    owner: "{{ target_user }}"
    mode: '0644'
    backup: true
  register: xremap_unit

- name: Enable the KDE input remapping service
  ansible.builtin.include_tasks: common/user_service.yml
  vars:
    user_service: xremap.service
    user_service_restart: "{{ xremap_launcher.changed or xremap_unit.changed }}"
