---
- name: Install vicinae-bin from AUR
  kewlfft.aur.aur:
    use: yay
    state: present
    name:
      - vicinae-bin
  become: true
  become_user: aur_builder

- name: Enable and start vicinae user service
  ansible.builtin.systemd:
    name: vicinae
    scope: user
    enabled: true
    state: started
    daemon_reload: true
  become: false
