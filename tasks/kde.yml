---

- name: Install KDE packages.
  community.general.pacman:
    update_cache: true
    name: [
      "kdiff3", "kommit", "kvantum", "sddm"
    ]
    state: present

- name: Install KDE Apps from aur.
  kewlfft.aur.aur:
    use: yay
    state: present
    name: ["konsave", "sddm-silent-theme"]
  become: true
  become_user: aur_builder

- name: Setup KDE theme
  become: false
  block:
    - name: Check if Graphite KDE theme is installed
      stat:
        path: "/home/{{ ansible_user }}/.local/share/plasma/desktoptheme/Graphite"
      register: graphite_installed

    - name: Clone Graphite KDE theme.
      git:
        repo: "https://github.com/vinceliuice/Graphite-kde-theme.git"
        dest: "/tmp/Graphite-kde-theme"
        clone: true
        update: true
      when: not graphite_installed.stat.exists

    - name: Install Graphite KDE theme.
      shell: |
        cd /tmp/Graphite-kde-theme
        ./install.sh
      args:
        chdir: /tmp/Graphite-kde-theme
      when: not graphite_installed.stat.exists

    - name: Enable theme
      shell: |
        plasma-apply-desktoptheme Graphite-nord-light

    - name: Ensure tabbox directory exists.
      become: false
      file:
        path: "/home/{{ ansible_user }}/.local/share/kwin/tabbox"
        recurse: yes
        state: directory

    - name: AquaMediumIcons tabbox style
      stat:
        path: "/home/{{ ansible_user }}/.local/share/kwin/tabbox/AquaMediumIcons"
      register: aquaicon_style

    - name: Clone AquaMediumIcons tabbox style
      git:
        repo: "https://github.com/harryxu/kde-aquamediumicons.git"
        dest: "/home/{{ ansible_user }}/.local/share/kwin/tabbox/AquaMediumIcons"
        clone: true
        update: true
      when: not aquaicon_style.stat.exists

    - name: kwinrc
      community.general.kdeconfig:
        kwriteconfig_path: /usr/bin/kwriteconfig6
        path: "/home/{{ ansible_user }}/.config/kwinrc"
        values: [
          # window theme
          { group: org.kde.kdecoration2, key: library, value: org.kde.kwin.aurorae },
          { group: org.kde.kdecoration2, key: theme, value: __aurorae__svg__Graphite-light },

          # wayland
          { group: Wayland, key: "InputMethod[$e]", value: /usr/share/applications/org.fcitx.Fcitx5.desktop },

          # task switch
          { group: TabBox, key: ApplicationsMode, value: 1 },
          { group: TabBox, key: HighlightWindows, bool_value: false },
          { group: TabBox, key: LayoutName, value: AquaMediumIcons },

          # Virtual Desktop
          { group: Desktops, key: Number, value: 3 },
        ]
        backup: true

    - name: Check if Tela Circle Icon theme is installed
      stat:
        path: "/home/{{ ansible_user }}/.local/share/icons/Tela-circle"
      register: tela_icon_installed

    - name: Clone Tela Circle Icon theme.
      git:
        repo: "https://github.com/vinceliuice/Tela-circle-icon-theme.git"
        dest: "/tmp/Tela-circle-icon-theme"
        clone: true
        update: true
      when: not tela_icon_installed.stat.exists

    - name: Install Tela Circle Icon theme.
      shell: |
        cd /tmp/Tela-circle-icon-theme
        ./install.sh
      args:
        chdir: /tmp/Tela-circle-icon-theme
      when: not tela_icon_installed.stat.exists

    - name: Setup kdeglobals
      community.general.kdeconfig:
        kwriteconfig_path: /usr/bin/kwriteconfig6
        path: "/home/{{ ansible_user }}/.config/kdeglobals"
        values: [
          # Icon theme
          # { group: Icons, key: Theme, value: Tela-circle },

          # KDE
          { group: KDE, key: AnimationDurationFactor, value: 0.5 },
          { group: KDE, key: LookAndFeelPackage, value: com.github.vinceliuice.Graphite-nord-light },
          { group: KDE, key: widgetStyle, value: kvantum },
        ]
        backup: true

    - name: kvantum.kvconfig
      copy:
        dest: "/home/{{ ansible_user }}/.config/Kvantum/kvantum.kvconfig"
        content: |
          [General]
          theme=Graphite
        force: no

- name: Setup Screen Locking
  shell: |
    kwriteconfig6 --file kscreenlockerrc \
      --group Greeter --key WallpaperPlugin org.kde.potd
    kwriteconfig6 --file kscreenlockerrc \
      --group Greeter --group Wallpaper --group org.kde.potd --group General \
      --key Provider bing
    kwriteconfig6 --file kscreenlockerrc \
      --group Greeter --group Wallpaper --group org.kde.potd --group General \
      --key UpdateOverMeteredConnection 1
  become: false

- name: Ensure krunner Command Shortcut desktop file exists
  ansible.builtin.copy:
    dest: "/home/{{ ansible_user }}/.local/share/applications/net.local.krunner.desktop"
    mode: '0644'
    content: |
      [Desktop Entry]
      Exec=krunner
      Name=KRunner
      NoDisplay=true
      StartupNotify=false
      Type=Application
      X-KDE-GlobalAccel-CommandShortcut=true

- name: Setup KDE keyboard shortcuts
  become: false
  community.general.kdeconfig:
    path: "/home/{{ ansible_user }}/.config/kglobalshortcutsrc"
    values:
      - groups: [services, org.kde.krunner.desktop]
        key: RunClipboard
        value: none
      - groups: [services, net.local.krunner.desktop]
        key: _launch
        value: "Alt+E"

- name: Configure SDDM theme
  community.general.ini_file:
    path: /etc/sddm.conf
    section: Theme
    option: Current
    value: silent
    no_extra_spaces: true
    backup: true
  become: true

- name: Copy SDDM silent theme background image
  ansible.builtin.copy:
    src: files/sddm/themes/silent/backgrounds/ristretto.jpg
    dest: /usr/share/sddm/themes/silent/backgrounds/random.jpg
    force: false
  become: true

- name: Copy SDDM silent theme altumfish config
  ansible.builtin.copy:
    src: files/sddm/themes/silent/configs/altumfish.conf
    dest: /usr/share/sddm/themes/silent/configs/altumfish.conf
    force: false
  become: true

- name: Update SDDM silent theme ConfigFile to altumfish.conf
  community.general.ini_file:
    path: /usr/share/sddm/themes/silent/metadata.desktop
    section: SddmGreeterTheme
    option: ConfigFile
    value: configs/altumfish.conf
    no_extra_spaces: true
    backup: true
  become: true

- name: Check current display manager symlink
  ansible.builtin.stat:
    path: /etc/systemd/system/display-manager.service
  register: display_manager_link
  become: true

- name: Resolve current display manager target
  ansible.builtin.command:
    cmd: readlink -f /etc/systemd/system/display-manager.service
  register: current_dm_target
  changed_when: false
  when:
    - display_manager_link.stat.exists
    - display_manager_link.stat.islnk
  become: true

- name: Disable current display manager if not SDDM
  ansible.builtin.systemd:
    name: "{{ current_dm_target.stdout | basename | regex_replace('\\.service$', '') }}"
    enabled: false
    state: stopped
  when:
    - display_manager_link.stat.exists
    - display_manager_link.stat.islnk
    - current_dm_target.stdout is defined
    - "'sddm' not in current_dm_target.stdout"
  become: true

- name: Enable SDDM as the display manager
  ansible.builtin.systemd:
    name: sddm
    enabled: true
    state: started
  become: true
