---
- name: Gather target facts without privilege escalation
  ansible.builtin.setup:
    gather_subset: [min]
  become: false

- name: Require Arch Linux
  ansible.builtin.assert:
    that: ansible_facts.os_family == 'Archlinux'
    fail_msg: This playbook supports Arch Linux targets.

- name: Identify the connection user
  ansible.builtin.command: whoami
  become: false
  register: connection_username
  changed_when: false
  check_mode: false

- name: Resolve the configuration owner
  ansible.builtin.set_fact:
    target_user: "{{ target_user | default('', true) or connection_username.stdout }}"

- name: Look up the configuration owner's home and UID
  ansible.builtin.getent:
    database: passwd
    key: "{{ target_user }}"

- name: Resolve target paths
  ansible.builtin.set_fact:
    target_home: "{{ ansible_facts.getent_passwd[target_user][4] }}"
    target_uid: "{{ ansible_facts.getent_passwd[target_user][1] }}"

- name: Require a non-root desktop user
  ansible.builtin.assert:
    that:
      - target_uid | int != 0
      - target_home is abs
      - target_home != '/'
    fail_msg: Set target_user to an existing non-root desktop user.

- name: Check for the user's session bus
  ansible.builtin.stat:
    path: "/run/user/{{ target_uid }}/bus"
  register: user_bus

- name: Check whether a graphical session is active
  ansible.builtin.systemd_service:
    name: graphical-session.target
    scope: user
  become: true
  become_user: "{{ target_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ target_uid }}"
    DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ target_uid }}/bus"
  register: graphical_session
  changed_when: false
  failed_when: false
  check_mode: false
  when: user_bus.stat.exists

- name: Resolve session capabilities
  ansible.builtin.set_fact:
    has_graphical_session: "{{ graphical_session.status.ActiveState | default('inactive') == 'active' }}"
    has_hyprland_session: >-
      {{ graphical_session.status.ActiveState | default('inactive') == 'active'
         and (ansible_facts.env.HYPRLAND_INSTANCE_SIGNATURE | default('') | length > 0)
         and connection_username.stdout == target_user }}

- name: Check Omarchy capabilities before shared tasks run
  ansible.builtin.include_tasks: desktop/omarchy/preflight.yml
  when: desktop_profile == 'omarchy'

- name: Gather mount facts for the optional snapshot integration
  ansible.builtin.setup:
    gather_subset: [mounts]
  when: features.snapper

- name: Check the optional Snapper integration's bootloader
  ansible.builtin.stat:
    path: /boot/grub/grub.cfg
  register: grub_config
  when: features.snapper

- name: Require the supported Btrfs and GRUB snapshot setup
  ansible.builtin.assert:
    that:
      - grub_config.stat.exists
      - ansible_facts.mounts | selectattr('mount', 'equalto', '/') | map(attribute='fstype') | first == 'btrfs'
    fail_msg: >-
      The legacy Snapper integration requires Btrfs and GRUB.
      Leave it disabled on an Omarchy system with its own snapshot setup.
  when: features.snapper
