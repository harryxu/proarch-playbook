---
- name: Install Snapper and its Pacman transaction hooks
  community.general.pacman:
    name:
      - snapper
      - snap-pac
    state: present

- name: Create the Snapper root configuration on GRUB hosts
  ansible.builtin.command: snapper -c root create-config /
  args:
    creates: /etc/snapper/configs/root
  when: snapper_active_bootloader == 'grub'

- name: Verify that Snapper has registered the root filesystem
  ansible.builtin.command: snapper --no-dbus --csvout list-configs
  register: snapper_configs
  changed_when: false
  failed_when: snapper_configs.rc != 0 or 'root,/' not in snapper_configs.stdout_lines

- name: Apply the root snapshot retention policy
  ansible.builtin.lineinfile:
    path: /etc/snapper/configs/root
    regexp: '^\s*{{ item.key }}\s*='
    line: '{{ item.key }}="{{ item.value }}"'
  loop:
    - { key: NUMBER_CLEANUP, value: 'yes' }
    - { key: NUMBER_MIN_AGE, value: '0' }
    - { key: NUMBER_LIMIT, value: '5' }
    - { key: NUMBER_LIMIT_IMPORTANT, value: '5' }
    - { key: TIMELINE_CREATE, value: 'no' }
  loop_control:
    label: "{{ item.key }}"

- name: Enable pre and post Pacman transaction snapshots for root
  community.general.ini_file:
    path: /etc/snap-pac.ini
    section: root
    option: snapshot
    value: "True"
    owner: root
    group: root
    mode: '0644'
    backup: true

- name: Configure the GRUB snapshot integration
  when: snapper_active_bootloader == 'grub'
  block:
    - name: Install the GRUB snapshot integration
      community.general.pacman:
        name:
          - grub-btrfs
          - inotify-tools
        state: present

    - name: Enable and start the grub-btrfsd service
      ansible.builtin.systemd_service:
        name: grub-btrfsd.service
        enabled: true
        state: started

- name: Enable and start snapshot cleanup
  ansible.builtin.systemd_service:
    name: snapper-cleanup.timer
    enabled: true
    state: started

- name: Enable and start Limine snapshot synchronization
  ansible.builtin.systemd_service:
    name: limine-snapper-sync.service
    enabled: true
    state: started
  when: snapper_active_bootloader == 'limine'
