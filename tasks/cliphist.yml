---
- name: Require the explicit KDE clipboard integration
  ansible.builtin.assert:
    that: desktop_profile == 'kde'
    fail_msg: Omarchy manages its own clipboard watchers.

- name: Install the standalone clipboard user unit
  ansible.builtin.copy:
    dest: "{{ target_home }}/.config/systemd/user/cliphist.service"
    content: |
      [Unit]
      Description=Cliphist Watch Service
      After=graphical-session-pre.target
      PartOf=graphical-session.target

      [Service]
      Type=simple
      ExecStart=/usr/bin/wl-paste --watch /usr/bin/cliphist store
      Restart=on-failure
      RestartSec=5

      [Install]
      WantedBy=graphical-session.target
    owner: "{{ target_user }}"
    mode: '0644'
    backup: true
  notify: Reload user systemd units
  register: cliphist_unit

- name: Enable the standalone clipboard integration
  ansible.builtin.include_tasks: common/user_service.yml
  vars:
    user_service: cliphist.service
    user_service_restart: "{{ cliphist_unit.changed }}"
