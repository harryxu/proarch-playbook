---
- name: Inspect the old standalone input autostart
  ansible.builtin.stat:
    path: "{{ target_home }}/.config/autostart/fcitx5.desktop"
  register: legacy_fcitx_autostart

- name: Read the old standalone input autostart
  ansible.builtin.slurp:
    src: "{{ target_home }}/.config/autostart/fcitx5.desktop"
  register: legacy_fcitx_contents
  when: legacy_fcitx_autostart.stat.exists

- name: Disable the duplicate entry only if it was generated by this playbook
  community.general.ini_file:
    path: "{{ target_home }}/.config/autostart/fcitx5.desktop"
    section: Desktop Entry
    option: Hidden
    value: 'true'
    no_extra_spaces: true
    owner: "{{ target_user }}"
    mode: '0644'
    backup: true
  when:
    - legacy_fcitx_autostart.stat.exists
    - "'Comment=Start Fcitx 5 input method' in (legacy_fcitx_contents.content | b64decode)"
