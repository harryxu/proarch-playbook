---
- name: Run the dotconfig installer on first deployment
  become: true
  become_user: "{{ target_user }}"
  environment:
    HOME: "{{ target_home }}"
  ansible.builtin.shell: |
    set -euo pipefail
    exec 9<.
    flock --exclusive 9
    if [[ -e .config/.git || -L .config/.git ]]; then
      exit 0
    fi

    installer=$(mktemp)
    trap 'rm -f -- "$installer"' EXIT
    curl --fail --silent --show-error --location --output "$installer" \
      https://raw.githubusercontent.com/harryxu/dotconfig/refs/heads/main/install.sh

    # An earlier task may have changed the login shell since this session started.
    SHELL=$(getent passwd "$UID" | cut -d: -f7)
    export SHELL
    bash "$installer" || {
      status=$?
      # Upstream creates .git early. Keep failed metadata without blocking a retry.
      if [[ -e .config/.git || -L .config/.git ]]; then
        backup=$(mktemp -d -- "$HOME/.proarch-dotconfig-failed.XXXXXXXX")
        mv -- .config/.git "$backup/"
        echo "Saved incomplete dotconfig Git metadata in $backup/.git" >&2
      fi
      exit "$status"
    }
    if [[ ! -e .config/.git ]]; then
      echo 'The dotconfig installer finished without creating ~/.config/.git.' >&2
      exit 1
    fi
    echo 'Initialized dotconfig'
  args:
    chdir: "{{ target_home }}"
    executable: /bin/bash
  register: dotconfig_install
  changed_when: "'Initialized dotconfig' in dotconfig_install.stdout_lines"
