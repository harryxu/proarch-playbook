---
- name: Check for Omarchy's native SDDM autologin configuration
  ansible.builtin.stat:
    path: "{{ sddm_config_file | default('/etc/sddm.conf') }}.d/autologin.conf"
    follow: true
  register: omarchy_sddm_autologin
  when: desktop_profile == 'omarchy'

- name: Detect a MacBook with passphrase-only LUKS root unlock
  ansible.builtin.script:
    cmd: "{{ playbook_dir }}/files/sddm/macbook-luks-unlock.py"
    executable: /usr/bin/python3
  register: sddm_root_unlock
  changed_when: false
  check_mode: false
  when: not (omarchy_sddm_autologin.stat.isreg | default(false))

- name: Find the installed session for the selected desktop profile
  ansible.builtin.stat:
    path: "{{ item }}"
    follow: true
  loop: "{{ sddm_session_paths[desktop_profile] }}"
  vars:
    sddm_session_paths:
      omarchy:
        - /usr/local/share/wayland-sessions/omarchy.desktop
        - /usr/share/wayland-sessions/omarchy.desktop
      kde:
        - /usr/share/wayland-sessions/plasma.desktop
        - /usr/share/xsessions/plasmax11.desktop
  register: sddm_desktop_sessions
  when: sddm_root_unlock.stdout | default('') | trim == 'passphrase'

- name: Resolve the SDDM autologin session
  ansible.builtin.set_fact:
    sddm_autologin_session: >-
      {{ sddm_desktop_sessions.results
         | selectattr('stat', 'defined') | selectattr('stat.isreg', 'defined')
         | selectattr('stat.isreg') | map(attribute='item') | map('basename') | first | default('') }}

- name: Apply the SDDM login policy for the selected desktop
  community.general.ini_file:
    path: "{{ sddm_config_file | default('/etc/sddm.conf') }}"
    section: Autologin
    option: "{{ item.option }}"
    value: "{{ item.value }}"
    # sddm.conf takes precedence over the installer-owned drop-in.
    state: "{{ 'absent' if use_omarchy_autologin else 'present' }}"
    create: "{{ not use_omarchy_autologin }}"
    no_extra_spaces: true
    backup: true
    mode: "0644"
  vars:
    use_omarchy_autologin: "{{ omarchy_sddm_autologin.stat.isreg | default(false) }}"
  loop:
    - option: Session
      value: "{{ sddm_autologin_session }}"
    - option: Relogin
      value: 'false'
    - option: User
      value: "{{ target_user if sddm_autologin_session | length > 0 else '' }}"
  when: use_omarchy_autologin or item.option == 'User' or sddm_autologin_session | length > 0
