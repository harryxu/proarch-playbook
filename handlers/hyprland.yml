---
- name: Reload the active Hyprland configuration
  ansible.builtin.command: hyprctl reload
  become: true
  become_user: "{{ target_user }}"
  environment:
    HYPRLAND_INSTANCE_SIGNATURE: "{{ ansible_facts.env.HYPRLAND_INSTANCE_SIGNATURE }}"
    XDG_RUNTIME_DIR: "/run/user/{{ target_uid }}"
  changed_when: true

- name: Check the reloaded configuration for errors
  ansible.builtin.command: hyprctl configerrors
  become: true
  become_user: "{{ target_user }}"
  environment:
    HYPRLAND_INSTANCE_SIGNATURE: "{{ ansible_facts.env.HYPRLAND_INSTANCE_SIGNATURE }}"
    XDG_RUNTIME_DIR: "/run/user/{{ target_uid }}"
  register: hyprland_config_errors
  changed_when: false

- name: Require an error-free Hyprland configuration
  ansible.builtin.assert:
    that: hyprland_config_errors.stdout | trim in ['', 'ok']
    fail_msg: "{{ hyprland_config_errors.stdout }}"
