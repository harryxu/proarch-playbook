---
# Required: choose kde or omarchy in config.yml or with -e.
desktop_profile: ""
target_user: ""
playbook_config_file: "{{ playbook_dir }}/config.yml"
timezone: Asia/Shanghai

feature_defaults:
  docker: true
  sshd: true
  dotconfig: true
  input_method: true
  rime_ice: true
  sddm_theme: true
  cliphist: false
  vicinae: false
  bluetooth: false
  snapper: false
  keybindings: false
  apfs_automount: false
feature_overrides: {}
extra_packages: []
extra_aur_packages: []
omarchy_overrides: {}
# Resolve when used, after preflight has looked up the target user's home.
omarchy_settings: >-
  {{ profile_defaults.omarchy | default({})
     | combine(omarchy_overrides, recursive=true, list_merge='replace') }}

dotconfig_repo: https://github.com/harryxu/dotconfig.git
dotconfig_version: HEAD
dotconfig_source_dir: "{{ target_home }}/.local/share/proarch/dotconfig"
# Only tracked files below these paths are deployed. Existing files are backed up.
dotconfig_paths:
  - fish
  - git
  - ghostty
  - herdr
  - kitty
  - nvim
  - scripts
  - starship.toml
  - tmux
  - zed

# Switching the display manager is opt-in and applies at the next boot/login.
kde_manage_display_manager: false

# Portable defaults; put hardware-specific values in config.yml.
keyboard_type: mac

# Omarchy-only device exceptions to the host keyboard type.
omarchy_keyboard_overrides: []
