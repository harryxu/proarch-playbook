---
# Read-only configuration and installed-desktop prerequisite checks.
- name: Validate the selected desktop without applying configuration
  hosts: all
  gather_facts: false
  become: false
  vars_files:
    - default.config.yml
  tasks:
    - name: Resolve configuration
      ansible.builtin.import_tasks: tasks/configuration.yml
    - name: Check the target environment
      ansible.builtin.import_tasks: tasks/preflight.yml
