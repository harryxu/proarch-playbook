---
- name: Configure an Arch Linux development desktop
  hosts: all
  gather_facts: false
  become: true
  vars_files:
    - default.config.yml

  pre_tasks:
    - name: Resolve and validate configuration before changing the host
      ansible.builtin.import_tasks: tasks/configuration.yml
      tags: [always]

    - name: Check the target system and desktop prerequisites
      ansible.builtin.import_tasks: tasks/preflight.yml
      tags: [always]

  tasks:
    - name: Configure shared packages and system services
      ansible.builtin.import_tasks: tasks/common/system.yml
      tags: [common, packages]

    - name: Deploy shared personal configuration
      ansible.builtin.import_tasks: tasks/common/dotconfig.yml
      when: features.dotconfig
      tags: [common, dotconfig]

    - name: Configure shared input method components
      ansible.builtin.import_tasks: tasks/common/input_method.yml
      when: features.input_method
      tags: [common, input_method]

    - name: Configure the selected desktop
      ansible.builtin.include_tasks:
        file: "tasks/desktop/{{ desktop_profile }}/main.yml"
        apply:
          tags: [desktop, "{{ desktop_profile }}"]
      tags: [desktop, kde, omarchy]

    - name: Configure optional features
      ansible.builtin.import_tasks: tasks/features/main.yml
      tags: [features]

    - name: Run local extras when supplied
      ansible.builtin.include_tasks:
        file: "{{ item }}"
        apply:
          tags: [extras]
      loop: "{{ query('ansible.builtin.fileglob', playbook_dir ~ '/extras.yml') }}"
      tags: [extras]

  handlers:
    - name: Load configuration handlers
      ansible.builtin.import_tasks: handlers/main.yml
