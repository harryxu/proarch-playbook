---
# Desktop defaults; host configuration can override these explicitly.
features: {}
packages:
  - omasnap
  - ttf-jetbrains-mono-nerd-basic
  - herdr
  - nwg-look
  # Dependencies for the dconf module that persists the GTK font preference.
  - dconf
  - python-psutil
  - python-gobject
aur_packages: []
dotconfig_paths: []
omarchy:
  version_pattern: ^4\.5\.
  screensaver_enabled: false
  independent_app_themes: true
  gtk_font: Noto Sans CJK SC 11 # Shared by GTK and Qt application interfaces.
  fcitx_font: Noto Sans CJK SC 12
  wallpaper_dir: "{{ target_home }}/Pictures/Wallpapers"
  wallpapers:
    - src: /usr/share/omarchy/themes/tokyo-night/backgrounds/0-liftoff.webp
      name: spacex-liftoff.webp
    - src: /usr/share/omarchy/themes/starship/backgrounds/2-flight14-dawn.webp
      name: spacex-flight14-dawn.webp
  shell:
    # Manage only these bar/dock fields; preserve all other personal preferences.
    bar:
      background: glassy
    dock:
      autohide: true
    idle:
      lock: 600
      screensaver: 999999
    version: 1
  plugins:
    - id: harryxu.dropspace
      repo: https://github.com/harryxu/omarchy-dropspace.git
    - id: harryxu.super-switcher
      repo: https://github.com/harryxu/omarchy-super-switcher.git
